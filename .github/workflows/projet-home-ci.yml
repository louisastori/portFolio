name: ProjetHome CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - "projetHome/**"
      - ".github/workflows/projet-home-ci.yml"
  pull_request:
    paths:
      - "projetHome/**"
      - ".github/workflows/projet-home-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetHome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: |
          if npm run | grep -q "test:e2e"; then
            npx playwright install --with-deps chromium
          fi

      - name: Run automated checks
        run: |
          if npm run | grep -q "^  test"; then
            npm test
          else
            for file in server/index.js server/config.js server/services/rssFeeds.js server/services/podcastHistory.js; do
              if [ -f "$file" ]; then
                node --check "$file"
              fi
            done
          fi
